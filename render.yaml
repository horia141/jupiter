previews:
  generation: automatic
  expireAfterDays: 1

# Shared env for WebAPI (and WebUI for blend flags + secrets).
# Per-service overrides still apply (e.g. SQLITE on webapi-srv uses /data).
envVarGroups:
  - name: jupiter-webapi-config
    envVars:
      - key: UNIVERSE
        value: thrive
      - key: ENV
        value: production
        previewValue: staging
      - key: INSTANCE
        value: Main
        previewValue: TO-FILL
      - key: SQLITE_DB_URL
        value: sqlite+aiosqlite:////tmp/jupiter.sqlite
      - key: ALEMBIC_INI_PATH
        value: /jupiter/src/core/migrations/alembic.postgres.ini
      - key: ALEMBIC_MIGRATIONS_PATH
        value: /jupiter/src/core/migrations/postgres
      - key: AUTH_PROVIDER
        value: local-google-apple
      - key: EMAIL_VERIFICATION_STRATEGY
        value: verify
        previewValue: none
      # Per-PR QA environments last a day and nobody watches Sentry for them,
      # so they report to their own console instead of mixing into the
      # production project's issues.
      - key: TELEMETRY
        value: sentry
        previewValue: local
      - key: CRM
        value: wix
        previewValue: noop
      - key: LOCATION_RESOLVER
        value: google-maps
      - key: WEBAPI_STORAGE_ENGINE
        value: postgres
      - key: WEBAPI_SEARCH
        value: algolia
      - key: WEBAPI_EMAIL_SENDER
        value: resend
        previewValue: noop
      - key: RESEND_FROM_EMAIL
        value: "Thrive <hello@updates.get-thriving.com>"
  - name: jupiter-webapi-secrets
    envVars:
      - key: ALGOLIA_APP_ID
        sync: false
      - key: ALGOLIA_WRITE_API_KEY
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: WIX_ACCOUNT_ID
        sync: false
      - key: WIX_API_KEY
        sync: false
      - key: WIX_SITE_ID
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_SERVICES_ID
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: APPLE_REFRESH_TOKEN_ENCRYPTION_KEY
        sync: false

# Repo-root-relative globs for auto-deploy builds. See https://render.com/docs/monorepo-support
services:
- type: web
  name: jupiter-webui
  buildFilter:
    paths:
      - src/webui/**
      - src/core/jupiter/core/**
      - gen/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - assets/**
      - src/Config.global
  runtime: docker
  dockerfilePath: ./src/webui/Dockerfile
  dockerContext: .
  region: frankfurt
  plan: starter
  autoDeploy: true
  rootDir: .
  numInstances: 1
  healthCheckPath: /healthz
  domains:
    - app.get-thriving.com
  previews:
    generation: automatic
    plan: starter
  envVars:
    - fromGroup: jupiter-webapi-config
    - fromGroup: jupiter-webapi-secrets
    - key: WEBAPI_SERVER_HOST
      fromService:
        name: jupiter-webapi-srv
        type: web
        property: host
    - key: WEBAPI_SERVER_PORT
      fromService:
        name: jupiter-webapi-srv
        type: web
        property: port
    - key: WEBAPI_URL
      fromService:
        name: jupiter-webapi-srv
        type: web
        envVarKey: RENDER_EXTERNAL_URL
    - key: WEBUI_URL
      fromService:
        name: jupiter-webui
        type: web
        envVarKey: RENDER_EXTERNAL_URL
    - key: API_URL
      value: https://api.get-thriving.com
    - key: MCP_URL
      value: https://mcp.get-thriving.com
    - key: DOCS_URL
      value: https://docs.get-thriving.com
    - key: SESSION_COOKIE_SECURE
      value: true
    - key: PUBLISHED_URL
      fromService:
        name: jupiter-published
        type: web
        envVarKey: RENDER_EXTERNAL_URL
- type: web
  name: jupiter-published
  buildFilter:
    paths:
      - src/published/**
      - src/core/jupiter/core/**
      - gen/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - assets/**
      - src/Config.global
  runtime: docker
  dockerfilePath: ./src/published/Dockerfile
  dockerContext: .
  region: frankfurt
  plan: starter
  autoDeploy: true
  rootDir: .
  numInstances: 1
  healthCheckPath: /publish/healthz
  domains:
    - published.get-thriving.com
  previews:
    generation: automatic
    plan: starter
  envVars:
    - key: UNIVERSE
      value: thrive
    - key: ENV
      value: production
      previewValue: staging
    - key: INSTANCE
      value: Main
      previewValue: TO-FILL
    - key: WEBAPI_SERVER_HOST
      fromService:
        name: jupiter-webapi-srv
        type: web
        property: host
    - key: WEBAPI_SERVER_PORT
      fromService:
        name: jupiter-webapi-srv
        type: web
        property: port
    - key: PUBLISHED_URL
      fromService:
        name: jupiter-published
        type: web
        envVarKey: RENDER_EXTERNAL_URL
    - key: DOCS_URL
      value: https://docs.get-thriving.com
    - key: AUTH_PROVIDER
      value: local-google-apple
    - key: EMAIL_VERIFICATION_STRATEGY
      value: verify
      previewValue: none
    - key: LOCATION_RESOLVER
      value: google-maps
    - key: GOOGLE_MAPS_API_KEY
      sync: false
- type: web
  name: jupiter-webapi-srv
  buildFilter:
    paths:
      - src/webapi/**
      - src/core/**
      - src/alib/py/framework/**
      - pyproject.toml
      - uv.lock
      - src/Config.global
  runtime: docker
  dockerfilePath: ./src/webapi/srv/Dockerfile
  dockerContext: .
  region: frankfurt
  plan: starter
  autoDeploy: true
  rootDir: .
  numInstances: 1
  healthCheckPath: /healthz
  domains:
    - webapi.infra.get-thriving.com
  previews:
    generation: automatic
    plan: starter
  envVars:
    - fromGroup: jupiter-webapi-config
    - fromGroup: jupiter-webapi-secrets
    - key: SQLITE_DB_URL
      value: sqlite+aiosqlite:////data/jupiter.sqlite
    - key: POSTGRES_DB_URL
      fromDatabase:
        name: jupiter-webapi-db
        property: connectionString
# Schedules match ``get_background_mutation_crontab()`` on each use case (see ``background_mutation_use_case``).
- type: cron
  name: jupiter-webapi-gc-do-all
  buildFilter:
    paths:
      - src/webapi/**
      - src/core/**
      - src/alib/py/framework/**
      - pyproject.toml
      - uv.lock
      - src/Config.global
  runtime: docker
  dockerfilePath: ./src/webapi/gc-do-all/Dockerfile
  dockerContext: .
  region: frankfurt
  plan: starter
  schedule: "0 * * * *"
  autoDeploy: true
  rootDir: .
  envVars:
    - fromGroup: jupiter-webapi-config
    - fromGroup: jupiter-webapi-secrets
    - key: WEBAPI_CRON_EXECUTION_MODE
