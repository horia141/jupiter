packages:
  - "gen/ts/webapi-client"
  - "src/core"
  - "src/webui"
  - "src/published"
  - "src/shell"
  - "src/desktop"
  - "src/mobile"

# pnpm 10 reads this from .npmrc (`node-linker`). pnpm 11, which the Docker
# images install, only reads it here. Hoisted matches local installs and puts
# transitive packages such as @mui/system on the workspace root, where Vite's
# resolve.dedupe looks for them.
nodeLinker: hoisted

# pnpm 11 reads overrides from here. package.json "pnpm.overrides" is kept for
# pnpm 10, which is what local mise installs.
overrides:
  react: 19.3.0
  react-dom: 19.3.0

# Allow dependency install/postinstall scripts (pnpm v10+ strictDepBuilds / allowBuilds; replaces package.json "pnpm.onlyBuiltDependencies").
allowBuilds:
  capacitor: true
  electron: true
  electron-forge: true
  electron-winstaller: true
  electron-packager: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  sharp: true
  unrs-resolver: true
  "@modelcontextprotocol/ext-apps": true
  # postinstall runs scripts/install-clients.mjs. The WebUI image does not need that.
  "@modelcontextprotocol/inspector": false
